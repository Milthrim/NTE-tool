name: Build Windows release
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test controller
        run: python tests/check_controller.py
      - name: Build standalone EXE
        run: python build.py
      - name: Test standalone runtime
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'self-test.json'
          $exe = (Resolve-Path 'dist/异环小游戏助手.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', ('"' + $report + '"')) -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'EXE self-test timed out' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'EXE self-test failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.frozen) { throw 'Unexpected self-test result' }
          Get-Content $report
      - name: Package source and executable
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'VERSION must be x.y.z' }
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force 'dist/package/源码' | Out-Null
          Copy-Item 'dist/异环小游戏助手.exe' 'dist/package/'
          Copy-Item 'docs/usage.md' 'dist/package/使用说明.md'
          Copy-Item 'src','tests','docs','third_party_licenses' 'dist/package/源码/' -Recurse
          Copy-Item 'build.py','requirements.txt','requirements-build.txt','README.md','VERSION' 'dist/package/源码/'
          Compress-Archive -Path 'dist/package/*' -DestinationPath 'dist/Net-tool-windows-x64.zip'
          $hashes = @('dist/异环小游戏助手.exe','dist/Net-tool-windows-x64.zip') | ForEach-Object {
            $hash = Get-FileHash $_ -Algorithm SHA256
            $hash.Hash.ToLower() + '  ' + (Split-Path $_ -Leaf)
          }
          $hashes | Set-Content 'dist/SHA256SUMS.txt' -Encoding utf8
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Net-tool-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; increment VERSION before publishing' }
          gh release create $env:RELEASE_TAG 'dist/异环小游戏助手.exe' 'dist/Net-tool-windows-x64.zip' 'dist/SHA256SUMS.txt' --target $env:GITHUB_SHA --title "Net-tool $env:RELEASE_TAG" --notes 'Windows x64 独立版。无需安装 Python。F8 开始或暂停，F9 停止。ZIP 包含程序和源码。' --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
